[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "varlens"
dynamic = ["version"]
description = "commandline manipulation of genomic variants and NGS reads"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.11"
authors = [{name = "Tim O'Donnell", email = "timodonnell@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2,<3",
    "pandas>=3,<4",
    "intervaltree>=3.1,<4",
    "pysam>=0.24.1,<0.25",
    "typechecks>=0.1.0",
    "varcode>=11.2.0,<12",
    "pyensembl>=2.27.2,<3",
    "pyfaidx>=0.9,<1",
    "mhctools>=4.1.1,<5",
    "topiary>=5.109.0,<6",
]

[project.optional-dependencies]
fusion = ["isovar>=1.78.0,<2"]
test = ["pytest>=8,<10", "pytest-cov>=5", "ruff>=0.15"]
docs = [
    "sphinx>=8,<10",
    "sphinx-rtd-theme>=3,<4",
    "sphinxcontrib-autoprogram>=0.1.9",
    "sphinxcontrib-programoutput>=0.20",
    "numpydoc>=1.10",
]

[project.urls]
Homepage = "https://github.com/openvax/varlens"

[project.scripts]
varlens-allele-support = "varlens.commands.allele_support:run"
varlens-variants = "varlens.commands.variants:run"
varlens-fusions = "varlens.commands.fusions:run"
varlens-reads = "varlens.commands.reads:run"

[tool.setuptools]
packages = ["varlens", "varlens.commands", "varlens.read_evidence"]

[tool.setuptools.dynamic]
version = {attr = "varlens.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ensembl: requires installed human Ensembl release 75 reference data",
    "netmhcpan: requires a working NetMHCpan installation and Ensembl 75 data",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
