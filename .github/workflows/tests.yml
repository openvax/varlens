name: Tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            setup.py
            pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'
          python -m pip check
      - name: Lint
        run: ./lint.sh
      - name: Test
        run: ./test.sh -m 'not ensembl and not netmhcpan'

  annotation:
    runs-on: ubuntu-latest
    env:
      PYENSEMBL_CACHE_DIR: ${{ github.workspace }}/.reference-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            setup.py
            pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'
          python -m pip check
      - name: Install Ensembl reference data
        run: |
          pyensembl install --release 75 --species human --custom-mirror https://github.com/openvax/ensembl-data/releases/download/GRCh37.75/
          python -c 'from pyensembl import EnsemblRelease; assert EnsemblRelease(75).installed()'
      - name: Test real annotation and Topiary integration
        run: ./test.sh -m 'ensembl and not netmhcpan'
